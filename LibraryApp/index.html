<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>📚 My Library</header>

    <div class="container">
      <div class="add-book">
        <input type="text" placeholder="Book Title" />
        <input type="text" placeholder="Author" />
        <input type="number" placeholder="Pages" />
        <button>Add Book</button>
      </div>

      <div class="book-list">
        <div class="book-card">
          <div class="book-title">The Hobbit</div>
          <div class="book-author">by J.R.R. Tolkien</div>
          <div class="status">Not Read Yet</div>
        </div>

        <div class="book-card">
          <div class="book-title">Atomic Habits</div>
          <div class="book-author">by James Clear</div>
          <div class="status">Read ✔</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
